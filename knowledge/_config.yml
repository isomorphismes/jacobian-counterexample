title: "A Three-Dimensional Keller Counterexample"
author: "Independent exact audit"
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

bibtex_bibfiles:
  - references.bib

html:
  favicon: ""
  use_issues_button: false
  use_repository_button: false
  home_page_in_navbar: true

sphinx:
  config:
    html_last_updated_fmt: "%Y-%m-%d"
    bibtex_reference_style: author_year
    html_theme_options:
      navigation_with_keys: false
