name: jacobian-animation
channels:
  - conda-forge
dependencies:
  - python=3.12
  - manim=0.20.1
  - manimpango=0.6.1
  - fonttools=4.51.0
  - ffmpeg>=7,<9
  - cairo=1.18.4
  - pycairo=1.29.0
  - pango=1.56.4
  # MathTex/Tex compilation.  The dvisvgm converter remains an explicit
  # system prerequisite because conda-forge has no standalone dvisvgm package.
  - texlive-core=20260301
  - portaudio>=19,<20
  - sox>=14.4,<15
  - pkg-config>=0.29,<1
  - pip>=26.1.2
  - pip:
      - "manim-voiceover[recorder]==0.4.0"
      - "piper-tts==1.4.2"
