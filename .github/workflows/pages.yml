name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the paper toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            lmodern \
            texlive-fonts-recommended \
            texlive-latex-extra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Verify exact certificates
        run: python artifacts/sympy/verify.py

      - name: Run Python tests
        run: pytest -q

      - name: Run site tests
        run: npm --prefix site test

      - name: Build the paper
        run: make paper

      - name: Build the knowledge book
        run: jupyter-book build knowledge

      - name: Build and assemble the site
        run: npm --prefix site run build

      - name: Verify the Pages artifact
        run: |
          test -s site/dist/index.html
          test -s site/dist/paper/one-map-three-descriptions.pdf
          test -s site/dist/paper/one-map-three-descriptions.tex
          test -s site/dist/book/index.html
          test -s site/dist/assets/hero-marked-roots.webp
          test -s site/dist/media/marked-root-explainer.mp4
          test -s site/dist/media/marked-root-explainer.en.vtt
          test -s site/dist/media/marked-root-explainer-transcript.md
          test -s site/dist/legal/third-party-notices.md
          if grep -Eq '(href|src)="/(assets|book|media|paper|src)/' site/dist/index.html; then
            echo "First-party site URLs must be relative under a GitHub Pages project path."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
          retention-days: 1

  deploy:
    name: Deploy publication
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
