name: exact certificates

on:
  push:
  pull_request:

jobs:
  sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python artifacts/sympy/verify.py
      - run: pytest -q
      - run: jupyter-book build knowledge
